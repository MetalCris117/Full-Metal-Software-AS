spring.application.name=axolotPolicy

server.port=8081

# Le dice a Hibernate que no intente verificar la base de datos al arrancar
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=none

